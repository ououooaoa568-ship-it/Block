<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Канск: Изнанка</title>
    
    <!-- Подключение стилей и скриптов карты Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* Базовые стили */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            overflow: hidden;
            width: 100vw;
            /* Динамическая высота и подгонка под челки (safe-area) */
            height: 100dvh;
            padding-bottom: env(safe-area-inset-bottom);
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* --- Экраны Авторизации и Приветствия --- */
        #auth-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .greeting-text {
            font-size: 24px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(20px);
            /* Добавлен эффект размытия при входе */
            filter: blur(10px);
            transition: all 1.2s ease;
            text-align: center;
            margin-bottom: 10px;
        }

        .greeting-text.show {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        .greeting-wrapper {
            transition: all 1s ease;
            text-align: center;
        }

        .greeting-wrapper.shift-up {
            transform: translateY(-40px) scale(0.9);
            color: #888;
        }

        /* Форма регистрации / Входа */
        .auth-card {
            background-color: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            width: 320px;
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s ease;
            position: absolute;
            top: 55%;
            pointer-events: none;
        }

        .auth-card.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* Карточка возвращающегося пользователя */
        .user-card {
            background-color: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            width: 250px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.4s ease; /* Ускорена базовая анимация для эффекта нажатия */
            position: absolute;
            top: 55%;
            pointer-events: none;
        }

        .user-card.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .user-card:hover {
            background-color: #222;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            background-color: #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #aaa;
        }

        /* Анимация расширения карточки на весь экран */
        .user-card.expand {
            position: fixed;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0;
            z-index: 10001;
            background-color: #0a0a0a;
            border: none;
            justify-content: center;
            opacity: 1;
            transform: scale(1) translateZ(0) !important;
            transition: all 0.8s cubic-bezier(0.86, 0, 0.07, 1);
        }

        .user-card.expand * {
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* Элементы формы */
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            outline: none;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #555;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #e0e0e0;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:hover { background-color: #fff; }
        .btn-dark { background-color: #222; color: #e0e0e0; border: 1px solid #444; }
        .btn-dark:hover { background-color: #333; }
        .btn-danger { background-color: #600; color: #fff; border: none; }
        .btn-danger:hover { background-color: #800; }
        .btn-success { background-color: #05400a; color: #fff; border: none; }
        .btn-success:hover { background-color: #0a6012; }

        .captcha-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .captcha-text {
            background: #222;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* --- Главный интерфейс приложения --- */
        #app-container {
            display: none;
            width: 100vw;
            height: 100%;
            flex-direction: column;
            position: relative;
        }

        .tab-content {
            display: none;
            flex-grow: 1;
            height: calc(100% - 80px);
            overflow-y: auto;
            position: relative;
        }

        .tab-content.active {
            display: block;
        }

        /* Карты */
        #main-map, #add-map {
            width: 100%;
            height: 100%;
            background-color: #121212;
        }

        /* Поиск на карте */
        .map-search-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            z-index: 1000;
            display: flex;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .map-search-bar input {
            flex-grow: 1;
            border: none;
            margin-bottom: 0;
            border-radius: 0;
            background: transparent;
        }
        
        .map-search-bar button {
            background: transparent;
            border: none;
            color: #fff;
            padding: 0 15px;
            cursor: pointer;
            border-left: 1px solid #333;
        }

        /* Кастомный маркер на карте */
        .custom-marker {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .marker-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #000;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .marker-label {
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            margin-top: 4px;
            white-space: nowrap;
            border: 1px solid #333;
        }

        /* Панель навигации "Жидкое стекло" */
        .nav-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 500px;
            height: 65px;
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 35px;
            display: flex;
            align-items: center;
            padding: 0 5px;
            z-index: 5000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            flex: 1;
            text-align: center;
            color: #888;
            font-size: 11px;
            font-weight: 500;
            z-index: 2;
            cursor: pointer;
            transition: color 0.4s ease;
            padding: 8px 0;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .nav-item.active {
            color: #fff;
        }

        .nav-item.active svg {
            transform: translateY(-2px) scale(1.1);
        }

        .nav-indicator {
            position: absolute;
            height: 48px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            z-index: 1;
            /* Пружинящая растяжка */
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }

        /* --- Внутренние страницы (Списки, Формы) --- */
        .page-container {
            padding: 30px 20px 100px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        h2 { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }

        .list-card {
            background: #151515;
            border: 1px solid #222;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            position: relative;
        }

        .danger-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            color: #000;
            margin-top: 10px;
        }

        .threats-list { margin-top: 10px; font-size: 13px; color: #aaa; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        .form-group input[type="range"] { width: 100%; }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        #map-picker-container {
            width: 100%;
            height: 250px;
            border: 1px solid #333;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        /* Попап на карте */
        .leaflet-popup-content-wrapper {
            background-color: #1a1a1a;
            color: #e0e0e0;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .leaflet-popup-tip { background-color: #1a1a1a; }
        .leaflet-popup-content h3 { margin-top: 0; margin-bottom: 5px; }
        .leaflet-popup-content .btn-danger { width: 100%; padding: 5px; margin-top: 8px; font-size: 12px; }

        /* Чат */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100% - 30px);
            background: #111;
            border-radius: 8px;
            border: 1px solid #222;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-message {
            background: #222;
            padding: 10px;
            border-radius: 8px;
            max-width: 85%;
            word-wrap: break-word;
        }
        .chat-message.self {
            background: #2b2b2b;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .chat-message.other {
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }
        .chat-header {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #151515;
            border-top: 1px solid #222;
        }
        .chat-input-area input {
            margin-bottom: 0;
            border-radius: 20px;
            padding: 10px 15px;
        }
        .chat-input-area button {
            background: transparent;
            border: none;
            color: #fff;
            padding: 0 15px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА И ПРИВЕТСТВИЯ -->
    <div id="auth-screen">
        <div class="greeting-wrapper" id="greeting-wrapper">
            <div class="greeting-text" id="greet-1">Привет,</div>
            <div class="greeting-text" id="greet-2"></div>
        </div>

        <!-- Форма для нового пользователя -->
        <div class="auth-card" id="register-card">
            <input type="text" id="reg-name" placeholder="Твое имя">
            <input type="text" id="reg-login" placeholder="Имя пользователя">
            <input type="password" id="reg-pass" placeholder="Пароль">
            
            <div class="captcha-box">
                <div class="captcha-text" id="captcha-task"></div>
                <input type="text" id="reg-captcha" placeholder="Ответ" style="margin-bottom: 0;">
            </div>
            
            <button class="btn" onclick="registerUser()">Зарегистрироваться</button>
            <button class="btn btn-dark" onclick="switchToLogin()">Уже есть аккаунт</button>
        </div>

        <!-- Форма ручного входа -->
        <div class="auth-card" id="login-card" style="display: none;">
            <input type="text" id="log-login" placeholder="Имя пользователя">
            <input type="password" id="log-pass" placeholder="Пароль">
            <button class="btn" onclick="loginUserManual()">Войти</button>
            <button class="btn btn-dark" onclick="switchToRegister()">Назад</button>
        </div>

        <!-- Карточка сохраненного пользователя -->
        <div class="user-card" id="saved-user-card" onclick="loginSavedUser()">
            <div class="user-avatar" id="saved-user-avatar">?</div>
            <div class="user-info">
                <div style="font-weight: bold; font-size: 16px;" id="saved-user-name">Имя</div>
                <div style="font-size: 12px; color: #888;" id="saved-user-login">@login</div>
            </div>
        </div>
    </div>


    <!-- ГЛАВНОЕ ПРИЛОЖЕНИЕ -->
    <div id="app-container">
        
        <!-- Вкладка 1: Карта -->
        <div class="tab-content active" id="tab-map">
            <!-- Поиск по Канску -->
            <div class="map-search-bar">
                <input type="text" id="map-search-input" placeholder="Поиск улицы Канска...">
                <button onclick="searchAddressKansk()">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </button>
            </div>
            <div id="main-map"></div>
        </div>

        <!-- Вкладка 2: Все заброшки -->
        <div class="tab-content" id="tab-list">
            <div class="page-container">
                <h2>Архив объектов</h2>
                <div id="locations-list"></div>
            </div>
        </div>

        <!-- Вкладка 3: Добавить -->
        <div class="tab-content" id="tab-add">
            <div class="page-container">
                <h2>Фиксация объекта</h2>
                
                <div class="form-group">
                    <label>Название объекта</label>
                    <input type="text" id="add-title" placeholder="Например: Цех №4">
                </div>

                <div class="form-group">
                    <label>Точка на карте (кликните для выбора)</label>
                    <div id="map-picker-container"></div>
                    <input type="hidden" id="add-lat">
                    <input type="hidden" id="add-lng">
                    <div style="font-size: 12px; color: #888; margin-top: 5px;" id="coords-display">Координаты не выбраны</div>
                </div>

                <div class="form-group">
                    <label>Уровень опасности: <span id="danger-val">5</span>/10</label>
                    <input type="range" id="add-danger" min="1" max="10" value="5" oninput="document.getElementById('danger-val').innerText = this.value">
                </div>

                <div class="form-group">
                    <label>Описание и залаз</label>
                    <input type="text" id="add-desc" placeholder="Краткое описание">
                </div>

                <div class="form-group">
                    <label>Зафиксированные угрозы:</label>
                    <label class="checkbox-group"><input type="checkbox" class="threat-cb" value="Охрана"> Охрана / Камеры</label>
                    <label class="checkbox-group"><input type="checkbox" class="threat-cb" value="Собаки"> Собаки</label>
                    <label class="checkbox-group"><input type="checkbox" class="threat-cb" value="Аварийность"> Аварийные перекрытия</label>
                    <label class="checkbox-group"><input type="checkbox" class="threat-cb" value="Маргиналы"> Местные маргиналы</label>
                    <label class="checkbox-group"><input type="checkbox" class="threat-cb" value="Затопление"> Глубокие подвалы / Вода</label>
                </div>

                <button class="btn" onclick="submitLocation()">Отправить на модерацию</button>
            </div>
        </div>

        <!-- Вкладка 4: Чат (Новая) -->
        <div class="tab-content" id="tab-chat">
            <div class="page-container" style="height: 100%; display: flex; flex-direction: column;">
                <h2>Общий канал</h2>
                <div class="chat-container">
                    <div class="chat-messages" id="chat-messages">
                        <!-- Сообщения будут здесь -->
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Сообщение..." onkeypress="if(event.key === 'Enter') sendChatMessage()">
                        <button onclick="sendChatMessage()">
                            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Вкладка 5: Профиль / Админка -->
        <div class="tab-content" id="tab-profile">
            <div class="page-container">
                <h2>Личное дело</h2>
                <div class="list-card">
                    <h3 id="profile-name">Имя</h3>
                    <p style="color:#888; margin-bottom: 15px;" id="profile-login">@login</p>
                    <p style="color:#0a6012; font-size: 12px; margin-bottom: 15px; font-weight: bold; display:none;" id="profile-role">Модератор</p>
                    <button class="btn btn-dark" onclick="logout()">Выйти из системы</button>
                </div>

                <!-- Блок администратора -->
                <div id="admin-panel" style="display: none; margin-top: 30px;">
                    <h2>Панель Модератора</h2>
                    <div id="admin-queue"></div>
                </div>

                <!-- Блок Суперадмина -->
                <div id="superadmin-panel" style="display: none; margin-top: 30px;">
                    <h2>Управление командой</h2>
                    <div class="list-card">
                        <input type="text" id="new-mod-login" placeholder="Логин пользователя">
                        <div style="display: flex; gap: 10px;">
                            <button class="btn btn-success" onclick="assignModRole(true)">Назначить модератором</button>
                            <button class="btn btn-danger" onclick="assignModRole(false)">Снять права</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Нижняя панель навигации (Жидкое стекло + 5 пунктов с SVG) -->
        <div class="nav-panel">
            <div class="nav-indicator" id="nav-indicator"></div>
            
            <div class="nav-item active" onclick="switchTab('map', this)">
                <svg viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
                Карта
            </div>
            
            <div class="nav-item" onclick="switchTab('list', this)">
                <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                Список
            </div>
            
            <div class="nav-item" onclick="switchTab('add', this)">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                Добавить
            </div>

            <div class="nav-item" onclick="switchTab('chat', this)">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                Чат
            </div>
            
            <div class="nav-item" onclick="switchTab('profile', this)">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Профиль
            </div>
        </div>

    </div>

    <script>
        // --- 1. ИНИЦИАЛИЗАЦИЯ ДАННЫХ И БАЗЫ ---
        let users = JSON.parse(localStorage.getItem('kansk_users')) || [];
        let locations = JSON.parse(localStorage.getItem('kansk_locations')) || [];
        let savedSession = localStorage.getItem('kansk_session'); // логин последнего юзера
        let currentUser = null;
        let expectedCaptchaResult = 0;

        // Принудительное создание Суперадмина
        const adminExists = users.find(u => u.login === 'Admin_kn');
        if (!adminExists) {
            users.push({ name: 'Суперадмин', login: 'Admin_kn', pass: '101010paR', isAdmin: true, isSuperAdmin: true });
            localStorage.setItem('kansk_users', JSON.stringify(users));
        }

        // --- 2. ЛОГИКА АВТОРИЗАЦИИ И АНИМАЦИЙ ---
        window.onload = () => {
            const greet1 = document.getElementById('greet-1');
            const greet2 = document.getElementById('greet-2');
            const wrapper = document.getElementById('greeting-wrapper');

            setTimeout(() => { greet1.classList.add('show'); }, 300);

            if (savedSession) {
                const user = users.find(u => u.login === savedSession);
                if (user) {
                    // Пользователь возвращается
                    greet2.innerText = 'Выберите аккаунт для входа.';
                    document.getElementById('saved-user-name').innerText = user.name;
                    document.getElementById('saved-user-login').innerText = '@' + user.login;
                    document.getElementById('saved-user-avatar').innerText = user.name.charAt(0).toUpperCase();
                    
                    setTimeout(() => { greet2.classList.add('show'); }, 1500);
                    setTimeout(() => { 
                        wrapper.classList.add('shift-up');
                        document.getElementById('saved-user-card').classList.add('show');
                    }, 3000);
                    return;
                }
            }

            // Новый пользователь
            generateCaptcha();
            greet2.innerText = 'Рады тебя видеть. Готов зарегистрироваться?';
            setTimeout(() => { greet2.classList.add('show'); }, 1500);
            setTimeout(() => { 
                wrapper.classList.add('shift-up');
                document.getElementById('register-card').classList.add('show');
            }, 3000);
        };

        function generateCaptcha() {
            const num1 = Math.floor(Math.random() * 10) + 1;
            const num2 = Math.floor(Math.random() * 10) + 1;
            expectedCaptchaResult = num1 + num2;
            document.getElementById('captcha-task').innerText = `${num1} + ${num2} =`;
        }

        function switchToLogin() {
            document.getElementById('register-card').style.display = 'none';
            document.getElementById('login-card').style.display = 'block';
            setTimeout(() => {
                document.getElementById('login-card').classList.add('show');
            }, 50);
        }

        function switchToRegister() {
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('login-card').classList.remove('show');
            document.getElementById('register-card').style.display = 'block';
        }

        function registerUser() {
            const name = document.getElementById('reg-name').value.trim();
            const login = document.getElementById('reg-login').value.trim();
            const pass = document.getElementById('reg-pass').value;
            const captcha = parseInt(document.getElementById('reg-captcha').value);

            if (!name || !login || !pass) { alert('Заполните все поля'); return; }
            if (captcha !== expectedCaptchaResult) { alert('Неверная капча'); generateCaptcha(); return; }
            if (users.find(u => u.login === login)) { alert('Пользователь уже существует'); return; }

            const newUser = { name, login, pass, isAdmin: false };
            users.push(newUser);
            localStorage.setItem('kansk_users', JSON.stringify(users));
            
            executeLogin(newUser);
        }

        function loginUserManual() {
            const login = document.getElementById('log-login').value.trim();
            const pass = document.getElementById('log-pass').value;
            
            const user = users.find(u => u.login === login && u.pass === pass);
            if (user) {
                executeLogin(user);
            } else {
                alert('Неверный логин или пароль');
            }
        }

        function loginSavedUser() {
            const card = document.getElementById('saved-user-card');
            const user = users.find(u => u.login === savedSession);
            
            // Эффект отдаления в глубину перед вылетом
            card.style.transform = 'scale(0.85) translateZ(-100px)';
            card.style.opacity = '0.5';
            
            setTimeout(() => {
                // Анимация расширения на весь экран
                card.classList.add('expand');
                document.getElementById('greeting-wrapper').style.opacity = '0';
                
                setTimeout(() => {
                    executeLogin(user, true);
                }, 800);
            }, 300);
        }

        function executeLogin(user, bypassAnimation = false) {
            currentUser = user;
            localStorage.setItem('kansk_session', user.login);
            
            document.getElementById('profile-name').innerText = user.name;
            document.getElementById('profile-login').innerText = '@' + user.login;
            
            if (user.isAdmin || user.isSuperAdmin) {
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('profile-role').style.display = 'block';
            }
            if (user.isSuperAdmin) {
                document.getElementById('superadmin-panel').style.display = 'block';
                document.getElementById('profile-role').innerText = 'Суперадмин';
            }

            if (!bypassAnimation) {
                document.getElementById('auth-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-screen').style.display = 'none';
                    initApp();
                }, 500);
            } else {
                document.getElementById('auth-screen').style.display = 'none';
                initApp();
            }
        }

        function logout() {
            localStorage.removeItem('kansk_session');
            location.reload();
        }

        // --- 3. ЛОГИКА ПРИЛОЖЕНИЯ И КАРТ ---
        let mainMap, addMap, addMarker;
        const KANSK_COORDS = [56.205, 95.700];

        function initApp() {
            document.getElementById('app-container').style.display = 'flex';
            initNavIndicator();
            initMainMap();
            initAddMap();
            renderList();
            initChat();
            if(currentUser.isAdmin || currentUser.isSuperAdmin) renderAdminPanel();
        }

        const tileLayerUrl = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
        const tileLayerOptions = {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            maxZoom: 19
        };

        function getDangerColor(level) {
            level = parseInt(level);
            if (level <= 3) return '#4caf50'; // Зеленый
            if (level <= 7) return '#ff9800'; // Оранжевый
            return '#f44336'; // Красный
        }

        function initMainMap() {
            mainMap = L.map('main-map', {zoomControl: false}).setView(KANSK_COORDS, 13);
            L.tileLayer(tileLayerUrl, tileLayerOptions).addTo(mainMap);
            loadMarkers();
        }

        async function searchAddressKansk() {
            const query = document.getElementById('map-search-input').value.trim();
            if(!query) return;
            
            try {
                // Поиск по OSM API с ограничением по Канску
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}, Канск, Красноярский край`);
                const data = await response.json();
                
                if(data && data.length > 0) {
                    mainMap.flyTo([data[0].lat, data[0].lon], 16, { duration: 1.5 });
                } else {
                    alert('Улица не найдена. Попробуйте уточнить запрос.');
                }
            } catch (e) {
                console.error("Ошибка поиска", e);
            }
        }

        function loadMarkers() {
            mainMap.eachLayer((layer) => {
                if (layer instanceof L.Marker) mainMap.removeLayer(layer);
            });

            locations.forEach(loc => {
                if (loc.status === 'approved') {
                    const color = getDangerColor(loc.danger);
                    
                    const customIcon = L.divIcon({
                        className: 'custom-marker',
                        html: `
                            <div class="marker-circle" style="background-color: ${color};"></div>
                            <div class="marker-label">${loc.danger}/10</div>
                        `,
                        iconSize: [30, 40],
                        iconAnchor: [15, 20]
                    });

                    // Кнопка удаления для админов/модеров
                    const deleteBtnHtml = (currentUser.isAdmin || currentUser.isSuperAdmin) 
                        ? `<button class="btn btn-danger" onclick="deleteLocation(${loc.id})">Удалить объект</button>` : '';

                    const popupHTML = `
                        <h3>${loc.title}</h3>
                        <div style="margin-bottom: 5px;">Опасность: <b style="color:${color}">${loc.danger}/10</b></div>
                        <p style="font-size: 12px; margin-bottom: 5px;">${loc.desc}</p>
                        <div style="font-size: 11px; color:#aaa;">Угрозы: ${loc.threats.join(', ') || 'Нет'}</div>
                        <div style="font-size: 10px; color:#666; margin-top: 5px;">Автор: @${loc.author}</div>
                        ${deleteBtnHtml}
                    `;

                    L.marker([loc.lat, loc.lng], {icon: customIcon}).addTo(mainMap)
                        .bindPopup(popupHTML);
                }
            });
        }

        function initAddMap() {
            addMap = L.map('map-picker-container').setView(KANSK_COORDS, 13);
            L.tileLayer(tileLayerUrl, tileLayerOptions).addTo(addMap);
            
            addMap.on('click', function(e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                
                document.getElementById('add-lat').value = lat;
                document.getElementById('add-lng').value = lng;
                document.getElementById('coords-display').innerText = `Координаты: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;

                if (addMarker) {
                    addMarker.setLatLng(e.latlng);
                } else {
                    addMarker = L.marker(e.latlng).addTo(addMap);
                }
            });
        }

        // --- 4. ДОБАВЛЕНИЕ, СПИСКИ И УДАЛЕНИЕ ---
        function submitLocation() {
            const title = document.getElementById('add-title').value.trim();
            const desc = document.getElementById('add-desc').value.trim();
            const danger = document.getElementById('add-danger').value;
            const lat = document.getElementById('add-lat').value;
            const lng = document.getElementById('add-lng').value;
            
            const threats = Array.from(document.querySelectorAll('.threat-cb:checked')).map(cb => cb.value);

            if (!title || !lat || !lng) {
                alert('Укажите название и выберите точку на карте!');
                return;
            }

            const newLoc = {
                id: Date.now(),
                title, desc, danger, lat, lng, threats,
                status: 'pending',
                author: currentUser.login
            };

            locations.push(newLoc);
            localStorage.setItem('kansk_locations', JSON.stringify(locations));
            
            alert('Объект отправлен на модерацию. Он появится на карте после проверки.');
            
            document.getElementById('add-title').value = '';
            document.getElementById('add-desc').value = '';
            document.getElementById('add-danger').value = 5;
            document.getElementById('danger-val').innerText = '5';
            document.querySelectorAll('.threat-cb').forEach(cb => cb.checked = false);
            document.getElementById('coords-display').innerText = 'Координаты не выбраны';
            if(addMarker) addMap.removeLayer(addMarker);
            addMarker = null;
            document.getElementById('add-lat').value = '';
            document.getElementById('add-lng').value = '';
            
            if(currentUser.isAdmin || currentUser.isSuperAdmin) renderAdminPanel();
        }

        function renderList() {
            const listContainer = document.getElementById('locations-list');
            listContainer.innerHTML = '';
            
            const approved = locations.filter(l => l.status === 'approved');
            
            if (approved.length === 0) {
                listContainer.innerHTML = '<div style="color:#666;">В архиве пока пусто.</div>';
                return;
            }

            approved.sort((a,b) => b.danger - a.danger).forEach(loc => {
                const color = getDangerColor(loc.danger);
                const deleteBtnHtml = (currentUser.isAdmin || currentUser.isSuperAdmin) 
                        ? `<button class="btn btn-danger" style="margin-top:10px; padding:6px;" onclick="deleteLocation(${loc.id})">Удалить объект</button>` : '';

                listContainer.innerHTML += `
                    <div class="list-card">
                        <div style="font-size: 18px; font-weight: bold;">${loc.title}</div>
                        <div class="danger-badge" style="background-color: ${color}">Опасность: ${loc.danger}/10</div>
                        <div style="margin-top: 10px; font-size: 14px;">${loc.desc}</div>
                        <div class="threats-list">Угрозы: ${loc.threats.join(', ') || 'Не отмечено'}</div>
                        ${deleteBtnHtml}
                    </div>
                `;
            });
        }

        function deleteLocation(id) {
            if(confirm("Вы уверены, что хотите навсегда удалить этот объект?")) {
                locations = locations.filter(l => l.id !== id);
                localStorage.setItem('kansk_locations', JSON.stringify(locations));
                loadMarkers();
                renderList();
            }
        }

        // --- 5. АДМИН ПАНЕЛЬ И КОМАНДА ---
        function renderAdminPanel() {
            const queue = document.getElementById('admin-queue');
            queue.innerHTML = '';
            
            const pending = locations.filter(l => l.status === 'pending');
            
            if (pending.length === 0) {
                queue.innerHTML = '<div style="color:#666;">Новых заявок нет.</div>';
                return;
            }

            pending.forEach(loc => {
                queue.innerHTML += `
                    <div class="list-card" style="border-color: #ff9800;">
                        <div style="font-weight: bold;">${loc.title} (от @${loc.author})</div>
                        <div style="font-size: 12px; color:#aaa; margin: 5px 0;">Опасность: ${loc.danger}/10 | Угрозы: ${loc.threats.join(', ')}</div>
                        <div style="font-size: 14px; margin-bottom: 15px;">${loc.desc}</div>
                        
                        <div style="display: flex; gap: 10px;">
                            <button class="btn btn-success" style="padding: 6px; margin:0;" onclick="moderateLoc(${loc.id}, 'approved')">Одобрить</button>
                            <button class="btn btn-danger" style="padding: 6px; margin:0;" onclick="moderateLoc(${loc.id}, 'rejected')">Отклонить</button>
                        </div>
                    </div>
                `;
            });
        }

        function moderateLoc(id, action) {
            if (action === 'rejected') {
                locations = locations.filter(l => l.id !== id);
            } else {
                const loc = locations.find(l => l.id === id);
                if (loc) loc.status = 'approved';
            }
            
            localStorage.setItem('kansk_locations', JSON.stringify(locations));
            renderAdminPanel();
            renderList();
            loadMarkers();
        }

        function assignModRole(giveRights) {
            const targetLogin = document.getElementById('new-mod-login').value.trim();
            if(!targetLogin) return;

            const userIndex = users.findIndex(u => u.login === targetLogin);
            if(userIndex === -1) {
                alert("Пользователь не найден.");
                return;
            }

            users[userIndex].isAdmin = giveRights;
            localStorage.setItem('kansk_users', JSON.stringify(users));
            alert(giveRights ? `Пользователь @${targetLogin} назначен модератором.` : `С пользователя @${targetLogin} сняты права модератора.`);
            document.getElementById('new-mod-login').value = '';
        }

        // --- 6. ОБЩИЙ ЧАТ С АВТООЧИСТКОЙ ---
        function initChat() {
            cleanOldMessages();
            renderChatMessages();
        }

        function cleanOldMessages() {
            let chat = JSON.parse(localStorage.getItem('kansk_chat')) || [];
            const now = Date.now();
            const timeLimit = 72 * 60 * 60 * 1000; // 72 часа (3 дня)
            
            const filteredChat = chat.filter(msg => (now - msg.timestamp) < timeLimit);
            
            if (chat.length !== filteredChat.length) {
                localStorage.setItem('kansk_chat', JSON.stringify(filteredChat));
            }
        }

        function renderChatMessages() {
            const chatContainer = document.getElementById('chat-messages');
            chatContainer.innerHTML = '';
            let chat = JSON.parse(localStorage.getItem('kansk_chat')) || [];

            chat.forEach(msg => {
                const isSelf = msg.author === currentUser.login;
                const d = new Date(msg.timestamp);
                const timeStr = `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
                
                chatContainer.innerHTML += `
                    <div class="chat-message ${isSelf ? 'self' : 'other'}">
                        <div class="chat-header">@${msg.author} • ${timeStr}</div>
                        <div>${msg.text}</div>
                    </div>
                `;
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;

            let chat = JSON.parse(localStorage.getItem('kansk_chat')) || [];
            chat.push({
                author: currentUser.login,
                text: text,
                timestamp: Date.now()
            });

            localStorage.setItem('kansk_chat', JSON.stringify(chat));
            input.value = '';
            cleanOldMessages();
            renderChatMessages();
        }

        // --- 7. НАВИГАЦИЯ (Жидкое стекло с пружиной) ---
        function initNavIndicator() {
            const firstItem = document.querySelector('.nav-item.active');
            updateIndicator(firstItem);
        }

        function updateIndicator(element) {
            const indicator = document.getElementById('nav-indicator');
            indicator.style.width = `${element.offsetWidth}px`;
            indicator.style.left = `${element.offsetLeft}px`;
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            updateIndicator(element);

            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');

            // Решение проблемы отрисовки Leaflet
            if (tabId === 'map') {
                setTimeout(() => { mainMap.invalidateSize(); }, 50);
            }
            if (tabId === 'add') {
                setTimeout(() => { addMap.invalidateSize(); }, 50);
            }
            if (tabId === 'list') {
                renderList();
            }
            if (tabId === 'chat') {
                cleanOldMessages();
                renderChatMessages();
            }
        }

        window.addEventListener('resize', () => {
            const activeItem = document.querySelector('.nav-item.active');
            if(activeItem) updateIndicator(activeItem);
        });

    </script>
</body>
</html>
